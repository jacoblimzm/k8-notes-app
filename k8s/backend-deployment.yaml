apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: notes-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
      annotations:
        ad.datadoghq.com/backend.logs: '[{"source": "python", "service": "notes-backend"}]' # adding log annotations allow auto discovery to parse your logs and correlate with the proper service
    spec:
      containers:
        - name: backend
          image: asia-southeast1-docker.pkg.dev/mcse-sandbox/jake-reg/notes-backend-amd:v0.6
          ports:
            - containerPort: 5000
          env:
            - name: DD_LOGS_INJECTION
              value: "true"
            - name: DD_ENV
              value: "dev"
            - name: DD_SERVICE
              value: "notes-backend"
            - name: DD_VERSION
              value: "0.2"
            - name: DB_HOST
              value: "postgres-service"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "notesdb"
            - name: DB_USER
              value: "postgres"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: postgres-password
          #   - name: DD_TRACE_AGENT_URL
          #     value: 'unix:///var/run/datadog/apm.socket'
          # volumeMounts:
          #   - name: apmsocketpath
          #     mountPath: /var/run/datadog
      # volumes:
      #   - hostPath:
      #       path: /var/run/datadog/
      #     name: apmsocketpath
