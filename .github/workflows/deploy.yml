name: Build and Deploy to GKE

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allow manual trigger

env:
  DOCKERHUB_USERNAME: jacoblimzm
  GKE_CLUSTER: cluster-jake
  GKE_ZONE: asia-southeast1-a
  PROJECT_ID: mcse-sandbox
  BACKEND_IMAGE: notes-backend-amd
  FRONTEND_IMAGE: notes-frontend-amd
  NGINX_IMAGE: nginx-proxy-amd

jobs:
  setup-build-publish-deploy:
    name: Setup, Build, Publish, and Deploy
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # Login to Docker Hub
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ env.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # Setup gcloud CLI
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    # Authenticate to Google Cloud
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    # Get GKE credentials
    - name: Get GKE credentials
      run: |
        gcloud container clusters get-credentials ${{ env.GKE_CLUSTER }} \
          --zone ${{ env.GKE_ZONE }} \
          --project ${{ env.PROJECT_ID }}

    # Build and Push Backend Image
    - name: Build and Push Backend Image
      run: |
        docker buildx build \
          --platform linux/amd64 \
          -t ${{ env.DOCKERHUB_USERNAME }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
          -t ${{ env.DOCKERHUB_USERNAME }}/${{ env.BACKEND_IMAGE }}:latest \
          --push \
          ./backend

    # Build and Push Frontend Image
    - name: Build and Push Frontend Image
      run: |
        docker buildx build \
          --platform linux/amd64 \
          -t ${{ env.DOCKERHUB_USERNAME }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
          -t ${{ env.DOCKERHUB_USERNAME }}/${{ env.FRONTEND_IMAGE }}:latest \
          --push \
          ./frontend

    # Build and Push Nginx Image
    - name: Build and Push Nginx Image
      run: |
        docker buildx build \
          --platform linux/amd64 \
          -t ${{ env.DOCKERHUB_USERNAME }}/${{ env.NGINX_IMAGE }}:${{ github.sha }} \
          -t ${{ env.DOCKERHUB_USERNAME }}/${{ env.NGINX_IMAGE }}:latest \
          --push \
          ./nginx

    # Deploy to GKE
    - name: Deploy to GKE
      run: |
        # Update backend deployment with new image
        kubectl set image deployment/backend \
          backend=${{ env.DOCKERHUB_USERNAME }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
          -n notes-app

        # Update frontend deployment with new image
        kubectl set image deployment/frontend \
          frontend=${{ env.DOCKERHUB_USERNAME }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
          -n notes-app

        # Update nginx deployment with new image
        kubectl set image deployment/nginx-proxy \
          nginx=${{ env.DOCKERHUB_USERNAME }}/${{ env.NGINX_IMAGE }}:${{ github.sha }} \
          -n notes-app

        # Wait for rollout to complete
        kubectl rollout status deployment/backend -n notes-app
        kubectl rollout status deployment/frontend -n notes-app
        kubectl rollout status deployment/nginx-proxy -n notes-app

    # Verify deployment
    - name: Verify Deployment
      run: |
        kubectl get services -n notes-app
        kubectl get pods -n notes-app

